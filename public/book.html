<!DOCTYPE html>
<html>
<head>
<title>Sign Post Rentals - Book Now</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<div class="max-w-2xl mx-auto p-10">

<h1 class="text-4xl font-bold mb-6">Book Your Sign Post</h1>

<form action="/checkout" method="POST" class="bg-white p-8 rounded shadow">

<div class="mb-4">
<label class="block font-bold mb-2">Full Name</label>
<input type="text" name="name" required class="w-full border px-3 py-2 rounded">
</div>

<div class="mb-4">
<label class="block font-bold mb-2">Email</label>
<input type="email" name="email" required class="w-full border px-3 py-2 rounded">
</div>

<div class="mb-4">
<label class="block font-bold mb-2">Property Address</label>
<input type="text" name="address" required class="w-full border px-3 py-2 rounded">
</div>

<div class="mb-4">
<label class="block font-bold mb-2">Sign Post Color</label>
<select name="post_color" required class="w-full border px-3 py-2 rounded">
<option value="">Select a color</option>
<option value="black">Black</option>
<option value="white">White</option>
<option value="blue">Blue</option>
<option value="red">Red</option>
</select>
</div>

<div class="mb-4">
<label class="block font-bold mb-2">Rental Duration (Weeks)</label>
<select name="rental_weeks" required class="w-full border px-3 py-2 rounded">
<option value="">Select duration</option>
<option value="1">1 Week - $35.00</option>
<option value="2">2 Weeks - $55.00</option>
<option value="4">4 Weeks - $90.00</option>
<option value="8">8 Weeks - $150.00</option>
</select>
</div>

<div class="mb-4">
<label class="block font-bold mb-2">Installation Date</label>
<input type="date" name="install_date" required class="w-full border px-3 py-2 rounded">
</div>

<button type="submit" class="w-full bg-black text-white py-3 rounded font-bold">
Proceed to Payment
</button>

</form>

<a href="index.html" class="mt-6 text-blue-600 hover:underline">Back to Home</a>

</div>

</body>
</html>
